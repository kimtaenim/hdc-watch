<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hdc-watch 투명 시계</title>
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header id="dial" class="dial" aria-live="polite">
  <div class="dial-row">
    <span id="dial-stock" class="dial-stock">불러오는 중</span>
    <span id="dial-score" class="dial-item"></span>
    <span id="dial-trend" class="dial-item"></span>
  </div>
  <div class="pickers">
    <label>종목 <select id="pick-stock"></select></label>
    <label>보기 <select id="pick-view">
      <option value="volume.train">시간대 이상탐지</option>
      <option value="volume.walls">매물벽 찾기</option>
    </select></label>
  </div>
</header>

<main>
  <section id="follow-wrap" class="panel">
    <h2>한 건 따라가기</h2>
    <p class="hint" id="follow-hint"></p>
    <div class="follow-pick">
      <select id="follow-select" aria-label="따라갈 봉"></select>
      <div class="quick">
        <button data-quick="worst">가장 드문 봉</button>
        <button data-quick="best">가장 흔한 봉</button>
        <button data-quick="latest">가장 최근 봉</button>
      </div>
    </div>
    <div id="follow-stage" class="follow-stage"></div>
    <div class="follow-nav">
      <button id="follow-prev">이전</button>
      <span id="follow-pos"></span>
      <button id="follow-next">다음</button>
    </div>
  </section>

  <section class="panel">
    <h2>톱니바퀴: 가장 최근 실행의 모든 단계</h2>
    <p class="hint" id="gears-meta"></p>
    <ol id="gears" class="gears"></ol>
  </section>

  <section class="panel">
    <h2>운행 기록</h2>
    <div class="table-wrap"><table id="runs" class="runs"></table></div>
  </section>
</main>

<footer class="foot">HDC 학습용 실험이며 투자 판단 자료가 아님</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
