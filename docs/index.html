<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>김태의 HDC 공부 페이지</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/site.css">
</head>
<body>
<header id="dial" class="dial" aria-live="polite">
  <h1 class="site-title">김태의 HDC 공부 페이지</h1>
  <div class="dial-row">
    <span id="dial-stock" class="dial-stock">불러오는 중</span>
    <span id="dial-score" class="dial-item"></span>
    <span id="dial-trend" class="dial-item"></span>
  </div>
  <div class="pickers">
    <label>종목 <select id="pick-stock"></select></label>
    <select id="pick-view" hidden aria-hidden="true">
      <option value="volume.train">거래량</option>
      <option value="trend">트렌드</option>
      <option value="lab">실험대</option>
      <option value="check">확인</option>
    </select>
  </div>
  <nav class="tabs" role="tablist" aria-label="화면">
    <button role="tab" data-view="volume.train" aria-selected="true">거래량</button>
    <button role="tab" data-view="trend">트렌드</button>
    <button role="tab" data-view="check">확인</button>
    <button role="tab" data-view="lab">실험대</button>
  </nav>
</header>

<main>
  <section id="today-wrap" class="panel" hidden>
    <h2 id="today-title">오늘</h2>
    <div id="today"></div>
  </section>

  <section id="vol-wrap" class="panel">
    <h2 id="vol-title">거래량 이상</h2>
    <div id="vol-over"></div>
    <div id="vol-day-title" class="day-title"></div>
    <div id="vol-day"></div>
  </section>

  <details id="flow-wrap" class="panel">
    <summary>HDC 계산 과정 보기 (고른 날)</summary>
    <div class="flow-pick">
      <select id="pick-date" aria-label="날짜"></select>
      <button id="pick-rare">가장 드문 봉이 있는 날</button>
    </div>
    <ol id="flow" class="gears"></ol>
  </details>

  <section id="trend-wrap" class="panel" hidden>
    <h2>트렌드: 키워드 옆에 새로 붙은 낱말</h2>
    <p class="hint" id="trend-when"></p>
    <div class="kw-tabs" id="kw-tabs" role="tablist" aria-label="키워드"></div>
    <div id="kw-summary"></div>
    <ol id="trend-flow" class="gears"></ol>
  </section>

  <section id="lab-wrap" class="panel" hidden>
    <h2 id="lab-title">실험대</h2>
    <ol id="lab" class="gears"></ol>
  </section>

  <details id="gears-wrap" class="panel">
    <summary id="gears-title">전체 계산 기록</summary>
    <p class="hint" id="gears-meta"></p>
    <ol id="gears" class="gears"></ol>
  </details>

  <section class="panel">
    <h2>운행 기록</h2>
    <div class="table-wrap"><table id="runs" class="runs"></table></div>
  </section>
</main>

<footer class="foot">HDC 학습용 실험이며 투자 판단 자료가 아님</footer>
<script type="module" src="js/app.js"></script>
</body>
</html>
