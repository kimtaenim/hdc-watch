# 2026-11-19부터 정기 수집은 자동 실행(volume-live.yml, keeper.py)이 한다. 이 워크플로는 손으로 한 번 돌릴 때만 쓴다.
# RSS 제목 수집과 트렌드 문맥 분석. 거래량 따라잡기도 함께 돈다(2026-11-18).
# 하루 네 번(한국 시각 7:20, 12:20, 17:20, 23:20). 2026-11-14 의장님 결정(두 번 → 네 번).
# RSS는 최근 글만 주므로(매체에 따라 4-16시간치) 간격 사이 기사 일부는 받지 못한다.
# 예약 시각은 UTC. 수십 분 밀리거나 빠질 수 있고, 그 기록은 docs/data/runs.json에 남는다.
name: 트렌드 수집과 분석
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-commit
jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m trend.analyze --collect
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "트렌드 수집 $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          for i in 1 2 3 4; do
            git pull --rebase && git push && exit 0
            # 거래량 실행과 runs.json이 부딪히면: 새로 받은 제목만 챙겨 최신 main 위에서 분석을 다시 한다.
            git rebase --abort || true
            cp -r docs/data/trend/titles "$RUNNER_TEMP/titles"
            git fetch -q origin main && git reset -q --hard origin/main
            cp -r "$RUNNER_TEMP/titles/." docs/data/trend/titles/
            rm -rf "$RUNNER_TEMP/titles"
            python -m trend.analyze
            git add docs/data
            git commit -q -m "트렌드 수집 $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M) (다시 분석)" || exit 0
            sleep $((i * 5))
          done
          exit 1
