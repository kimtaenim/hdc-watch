# RSS 후보 주소 확인(수동). 결과: docs/data/trend/feed_check.json
name: RSS 주소 확인
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: data-commit
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m trend.probe
      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trend
          git diff --cached --quiet && exit 0
          git commit -m "RSS 주소 확인 결과"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((i * 5)); done
          exit 1
