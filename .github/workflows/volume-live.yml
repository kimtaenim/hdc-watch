# 거래량 장중 채점과 장 마감 갱신: 이어달리기 실행(2026-11-19부터).
# GitHub 예약 실행은 몇 시간씩 밀리거나 빠져서(2026-11-17-19 기록) 예약에 기대지 않는다.
#   실행 하나가 5시간 45분 동안 살면서 평일 09:05-15:35 매시 5분·35분과 16:05에 채점하고 커밋한다.
#   시간이 다 차면 이 워크플로를 다시 켜고 끝난다(volume/keeper.py). 그래서 한 번 켜지면 계속 이어진다.
# 아래 예약은 이어달리기가 끊겼을 때 다시 잇는 예비다. 이미 돌고 있으면 뒤에 켜진 것은 기다렸다가 이어 받는다.
# 멈추려면: GitHub 저장소 Actions 화면에서 이 워크플로를 끈다(Disable workflow).
name: 거래량 장중 채점
on:
  schedule:
    - cron: "41 23 * * 0-4"
    - cron: "13 1,3,7,11 * * 1-5"
  workflow_dispatch:
    inputs:
      life_min:
        description: "이번 실행의 수명(분). 비우면 345분. 이어달리기 확인용"
        required: false
        default: ""
permissions:
  contents: write
  actions: write
concurrency: volume-loop
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 이어달리기
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIFE_MIN: ${{ inputs.life_min }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m volume.keeper
